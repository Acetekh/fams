<!DOCTYPE html>
<html lang="en" class="h-full bg-[#1b1c1e]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>financial asset management services Login Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            gs: {
              black: '#080809',
              card: '#121316',
              border: '#24262b',
              subtle: '#636875',
              accent: '#ffffff',
              hover: '#e5e5e5'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    
    /* Fine grid overlay for left side panel */
    .bg-grid-pattern {
      background-size: 50% 50%;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }

    /* Left Side Emblem Smooth Rotating Animation */
    @keyframes spinSlow {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    .animate-spin-emblem {
      animation: spinSlow 35s linear infinite;
      transition: transform 0.5s ease-out, filter 0.5s ease-out;
    }

    .emblem-container:hover .animate-spin-emblem {
      animation-play-state: paused;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.35));
    }

    /* Custom styling for inputs */
    .gs-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      outline: none;
      transition: border-color 0.3s ease, color 0.3s ease;
      padding-bottom: 8px;
    }

    .gs-input:focus {
      border-bottom-color: #ffffff;
    }

    .gs-input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    /* Custom Checkbox Animation */
    .custom-check {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .custom-check:checked {
      border-color: #ffffff;
      background-color: #ffffff;
    }

    .custom-check:checked::after {
      content: '✓';
      color: #000;
      font-size: 11px;
      font-weight: bold;
    }

    /* Smooth tab switch transition */
    .fade-panel {
      transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out;
    }

    /* Hide scrollbars */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="min-h-screen bg-[#8c8c8e] text-white flex items-center justify-center p-3 md:p-6 lg:p-12 font-sans select-none overflow-x-hidden">

  <div class="w-full max-w-[1240px] aspect-[16/10] min-h-[640px] bg-[#000000] rounded-[28px] md:rounded-[40px] p-3 sm:p-5 md:p-7 shadow-[0_35px_70px_-15px_rgba(0,0,0,0.85)] border border-[#2b2d32] relative flex flex-col justify-between overflow-hidden">
    
    <!-- Outer Frame Gloss Header Details (Tablet Look) -->
    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-[#18181a] rounded-b-lg z-50"></div>

    <!-- Inner Screen Area -->
    <div class="w-full h-full bg-[#050506] rounded-[20px] md:rounded-[28px] overflow-hidden flex flex-col md:flex-row relative border border-[#1a1b1e]">

      <!-- Left Panel -->
      <div class="w-full md:w-1/2 h-64 md:h-full bg-gs-black relative flex flex-col justify-between p-6 sm:p-8 md:p-10 lg:p-12 border-b md:border-b-0 md:border-r border-[#151619] overflow-hidden emblem-container cursor-pointer">
        
        <!-- Faint Grid lines background -->
        <div class="absolute inset-0 bg-grid-pattern opacity-60 pointer-events-none"></div>

        <!-- Faint Diagonal Axis Lines -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none opacity-20" xmlns="http://www.w3.org/2000/svg">
          <line x1="0" y1="0" x2="100%" y2="100%" stroke="white" stroke-width="0.75" />
          <line x1="100%" y1="0" x2="0" y2="100%" stroke="white" stroke-width="0.75" />
        </svg>

        <!-- Brand Header -->
        <div class="z-10 flex items-center justify-between">
          <div class="flex items-center space-x-1 tracking-wider text-sm sm:text-base font-medium text-white">
            <span>FAMS</span>
            <span class="text-[10px] align-top font-light tracking-normal opacity-80">®</span>
          </div>
        </div>

        <!-- Animated Central Emblem / Starburst Graphic -->
        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div class="relative w-44 h-44 sm:w-56 sm:h-56 md:w-64 md:h-64 flex items-center justify-center animate-spin-emblem">
            
            <!-- Radiating Center lines (8-ray Starburst) -->
            <div class="absolute w-28 sm:w-36 md:w-40 h-[3px] bg-white rounded-full"></div>
            <div class="absolute h-28 sm:h-36 md:h-40 w-[3px] bg-white rounded-full"></div>
            
            <!-- Diagonal rays -->
            <div class="absolute w-24 sm:w-32 md:w-36 h-[1.5px] bg-white opacity-90 rounded-full rotate-45"></div>
            <div class="absolute w-24 sm:w-32 md:w-36 h-[1.5px] bg-white opacity-90 rounded-full -rotate-45"></div>

            <!-- Central cutout gap -->
            <div class="absolute w-6 h-6 bg-gs-black rounded-full z-10 flex items-center justify-center"></div>
          </div>
        </div>

        <!-- Footer Copyright -->
        <div class="z-10 text-[10px] sm:text-xs text-[#525660] font-normal tracking-wide">
          © FAMS 2026. All rights reserved.
        </div>
      </div>

      <!-- Right Form Panel -->
      <div class="w-full md:w-1/2 h-full bg-[#111215] relative flex flex-col justify-between p-6 sm:p-10 md:p-12 lg:p-16 overflow-y-auto no-scrollbar">
        
        <div id="loginView" class="fade-panel h-full flex flex-col justify-between">
          
          <!-- Top Navigation Switch -->
          <div class="flex justify-end items-center">
            <button id="switchToRegister" class="text-xs sm:text-sm text-gs-subtle hover:text-white transition-colors cursor-pointer font-light">
              Create an account
            </button>
          </div>

          <!-- Main Form Container -->
          <div class="my-auto py-8">
            <h1 class="text-4xl sm:text-5xl md:text-6xl font-extralight text-white tracking-tight mb-10 sm:mb-14">
              Login
            </h1>

            <form id="loginForm" onsubmit="handleAuthSubmit(event, 'login')">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-8 sm:gap-6 mb-8">
                
                <!-- Email Input Field -->
                <div class="flex flex-col space-y-2">
                  <label for="email" class="text-[10px] uppercase tracking-widest text-[#636875] font-semibold">
                    Email
                  </label>
                  <input 
                    type="email" 
                    id="email" 
                    required
                    value="Mattew@gmail.com" 
                    class="gs-input text-sm sm:text-base font-light tracking-wide w-full"
                    placeholder="name@domain.com"
                  >
                </div>

                <!-- Password Input Field -->
                <div class="flex flex-col space-y-2 relative">
                  <label for="password" class="text-[10px] uppercase tracking-widest text-[#636875] font-semibold">
                    Password
                  </label>
                  <div class="relative w-full">
                    <input 
                      type="password" 
                      id="password" 
                      required
                      value="password123" 
                      class="gs-input text-sm sm:text-base font-light tracking-widest w-full pr-8"
                    >
                    <button 
                      type="button" 
                      onclick="togglePassword('password', 'eyeIcon1')"
                      class="absolute right-0 bottom-2 text-[#636875] hover:text-white transition-colors"
                      title="Toggle password view"
                    >
                      <i id="eyeIcon1" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

              </div>

              <!-- Options Row: Remember Me & Forgot -->
              <div class="flex items-center justify-between text-xs sm:text-sm font-light pt-2">
                <label class="flex items-center space-x-2.5 cursor-pointer text-[#8b909e] hover:text-white transition-colors">
                  <input type="checkbox" checked class="custom-check">
                  <span class="text-xs">Remember me</span>
                </label>

                <a href="#" onclick="showModal('Password Reset', 'Password recovery instructions have been sent to your registered email.', 'mail')" class="text-xs text-[#8b909e] hover:text-white transition-colors">
                  Forgot?
                </a>
              </div>
            </form>
          </div>

          <!-- Bottom Floating White Sign-In Action Button -->
          <div class="flex justify-end pt-4">
            <button 
              type="submit" 
              form="loginForm"
              class="group relative w-20 h-20 sm:w-24 sm:h-24 bg-white rounded-full flex items-center justify-center text-black font-semibold text-xs tracking-wider uppercase transition-all duration-300 hover:scale-105 hover:bg-[#f0f0f0] active:scale-95 shadow-xl cursor-pointer"
            >
              <span class="z-10 group-hover:tracking-widest transition-all">SIGN IN</span>
            </button>
          </div>

        </div>

        <div id="registerView" class="fade-panel h-full flex flex-col justify-between hidden opacity-0 transform translate-y-4">
          
          <!-- Top Navigation Switch -->
          <div class="flex justify-end items-center">
            <button id="switchToLogin" class="text-xs sm:text-sm text-gs-subtle hover:text-white transition-colors cursor-pointer font-light">
              Already registered? Sign in
            </button>
          </div>

          <!-- Register Form Container -->
          <div class="my-auto py-8">
            <h1 class="text-4xl sm:text-5xl font-extralight text-white tracking-tight mb-8">
              Create account
            </h1>

            <form id="registerForm" onsubmit="handleAuthSubmit(event, 'register')">
              <div class="space-y-6 mb-8">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                  <!-- Name Input -->
                  <div class="flex flex-col space-y-2">
                    <label class="text-[10px] uppercase tracking-widest text-[#636875] font-semibold">
                      Full Name
                    </label>
                    <input 
                      type="text" 
                      required
                      class="gs-input text-sm sm:text-base font-light tracking-wide w-full"
                      placeholder="Mark Johnson"
                    >
                  </div>

                  <!-- Phone Input -->
                  <div class="flex flex-col space-y-2">
                    <label class="text-[10px] uppercase tracking-widest text-[#636875] font-semibold">
                      Phone Number
                    </label>
                    <input 
                      type="tel" 
                      required
                      class="gs-input text-sm sm:text-base font-light tracking-wide w-full"
                      placeholder="+41 44 123 4567"
                    >
                  </div>
                </div>

                <!-- Email Input -->
                <div class="flex flex-col space-y-2">
                  <label class="text-[10px] uppercase tracking-widest text-[#636875] font-semibold">
                    Email Address
                  </label>
                  <input 
                    type="email" 
                    required
                    class="gs-input text-sm sm:text-base font-light tracking-wide w-full"
                    placeholder="mattew@gmail.com"
                  >
                </div>

                <!-- New Password Input -->
                <div class="flex flex-col space-y-2 relative">
                  <label class="text-[10px] uppercase tracking-widest text-[#636875] font-semibold">
                    Password
                  </label>
                  <div class="relative w-full">
                    <input 
                      type="password" 
                      id="regPassword"
                      required
                      class="gs-input text-sm sm:text-base font-light tracking-widest w-full pr-8"
                      placeholder="••••••••••••"
                    >
                    <button 
                      type="button" 
                      onclick="togglePassword('regPassword', 'eyeIcon2')"
                      class="absolute right-0 bottom-2 text-[#636875] hover:text-white transition-colors"
                    >
                      <i id="eyeIcon2" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

              </div>

              <!-- Terms Checkbox -->
              <div class="flex items-center space-x-2.5 pt-1">
                <input type="checkbox" required class="custom-check">
                <span class="text-xs text-[#8b909e] font-light">I accept the <a href="#" onclick="showModal('Terms of Service', 'Financial asset management services terms of luxury banking and digital vault management apply.', 'shield-check')" class="underline hover:text-white">Terms & Privacy Policy</a></span>
              </div>
            </form>
          </div>

          <!-- Floating Action Button for Register -->
          <div class="flex justify-end pt-4">
            <button 
              type="submit" 
              form="registerForm"
              class="group relative w-20 h-20 sm:w-24 sm:h-24 bg-white rounded-full flex items-center justify-center text-black font-semibold text-xs tracking-wider uppercase transition-all duration-300 hover:scale-105 hover:bg-[#f0f0f0] active:scale-95 shadow-xl cursor-pointer"
            >
              <span class="z-10 text-center leading-tight group-hover:tracking-widest transition-all">JOIN NOW</span>
            </button>
          </div>

        </div>

      </div>

    </div>
  </div>

  <!-- Animated Sign-In Pop-Up Modal -->
  <div id="customModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 p-4">
    <div id="modalBox" class="bg-[#121316] border border-[#2b2d35] rounded-3xl max-w-sm w-full p-8 transform scale-90 transition-all duration-300 shadow-[0_25px_50px_-12px_rgba(0,0,0,0.8)] text-center relative overflow-hidden">
      
      <!-- Subtle top ambient light effect -->
      <div class="absolute -top-12 -left-12 w-32 h-32 bg-white/5 rounded-full blur-2xl pointer-events-none"></div>

      <!-- Icon Badge -->
      <div class="w-16 h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-5 border border-white/20 text-white shadow-inner">
        <i id="modalIcon" data-lucide="check-circle-2" class="w-8 h-8 stroke-[1.5]"></i>
      </div>

      <h3 id="modalTitle" class="text-2xl font-light text-white tracking-tight mb-2">Welcome Back</h3>
      <p id="modalBody" class="text-xs text-[#8b909e] font-light leading-relaxed mb-6">
        Authenticated successfully.
      </p>

      <button onclick="closeModal()" class="w-full py-3.5 bg-white text-black font-semibold text-xs tracking-widest uppercase rounded-full hover:bg-gray-200 transition-all active:scale-95 shadow-lg cursor-pointer">
        Continue to FAMS
      </button>
    </div>
  </div>

  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // Toggle Password Visibility
    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    // Tab Switching Logic (Login <-> Register)
    const loginView = document.getElementById('loginView');
    const registerView = document.getElementById('registerView');
    const switchToRegisterBtn = document.getElementById('switchToRegister');
    const switchToLoginBtn = document.getElementById('switchToLogin');

    switchToRegisterBtn.addEventListener('click', () => {
      loginView.classList.add('opacity-0', 'translate-y-4');
      setTimeout(() => {
        loginView.classList.add('hidden');
        registerView.classList.remove('hidden');
        setTimeout(() => {
          registerView.classList.remove('opacity-0', 'translate-y-4');
        }, 50);
      }, 300);
    });

    switchToLoginBtn.addEventListener('click', () => {
      registerView.classList.add('opacity-0', 'translate-y-4');
      setTimeout(() => {
        registerView.classList.add('hidden');
        loginView.classList.remove('hidden');
        setTimeout(() => {
          loginView.classList.remove('opacity-0', 'translate-y-4');
        }, 50);
      }, 300);
    });

    // Custom Pop-up Modal System
    function showModal(title, message, iconName = 'check-circle-2') {
      const modal = document.getElementById('customModal');
      const modalBox = document.getElementById('modalBox');
      const modalIcon = document.getElementById('modalIcon');
      
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalBody').innerText = message;
      
      modalIcon.setAttribute('data-lucide', iconName);
      lucide.createIcons();

      modal.classList.remove('opacity-0', 'pointer-events-none');
      modalBox.classList.remove('scale-90');
      modalBox.classList.add('scale-100');
    }

    function closeModal() {
      const modal = document.getElementById('customModal');
      const modalBox = document.getElementById('modalBox');
      
      modal.classList.add('opacity-0', 'pointer-events-none');
      modalBox.classList.remove('scale-100');
      modalBox.classList.add('scale-90');
    }

    // Form Submit Handler
    function handleAuthSubmit(event, mode) {
      event.preventDefault();
      if (mode === 'login') {
        const email = document.getElementById('email').value;
        showModal(
          'Authentication Successful', 
          `Welcome back, ${email}. Your secure FAMS session is ready.`, 
          'check-circle-2'
        );
      } else {
        showModal(
          'Account Created', 
          'Your registration request has been submitted. A relationship manager will contact you shortly.', 
          'user-check'
        );
      }
    }
  </script>
</body>
</html>
