<!DOCTYPE html>
<html lang="en" class="h-full bg-[#1b1c1e]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>financial asset management services  Login Interface</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            gs: {
              black: '#080809',
              card: '#121316',
              border: '#24262b',
              subtle: '#636875',
              accent: '#ffffff',
              hover: '#e5e5e5'
            }
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        
    }
    
    /* Fine grid overlay for left side panel */
    .bg-grid-pattern {
      background-size: 50% 50%;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.04) 1px, transparent 1px);
    }

    /* Left Side Emblem Smooth Rotating Animation */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .animate-spin-emblem {
      animation: spinSlow 35s linear infinite;
      transition: transform 0.5s ease-out, filter 0.5s ease-out;
    }

    .emblem-container:hover .animate-spin-emblem {
      animation-play-state: paused;
      filter: drop-shadow(0 0 12px rgba(255, 255, 255, 0.35));
    }

    /* PERFECT 4-STEP SEQUENTIAL LINE RELAY ANIMATION */
    @keyframes seqTLtoBR {
      0% { stroke-dashoffset: 25; }
      24.9% { stroke-dashoffset: -100; }
      25%, 100% { stroke-dashoffset: 25; }
    }

    @keyframes seqBLtoTR {
      0%, 25% { stroke-dashoffset: 25; }
      49.9% { stroke-dashoffset: -100; }
      50%, 100% { stroke-dashoffset: 25; }
    }

    @keyframes seqBRtoTL {
      0%, 50% { stroke-dashoffset: 25; }
      74.9% { stroke-dashoffset: -100; }
      75%, 100% { stroke-dashoffset: 25; }
    }

    @keyframes seqTRtoBL {
      0%, 75% { stroke-dashoffset: 25; }
      99.9% { stroke-dashoffset: -100; }
      100% { stroke-dashoffset: 25; }
    }

    .animate-seq-1 {
      stroke-dasharray: 25 100;
      animation: seqTLtoBR 13s linear infinite;
      filter: drop-shadow(0 0 6px rgba(0, 240, 255, 0.9));
    }

    .animate-seq-2 {
      stroke-dasharray: 25 100;
      animation: seqBLtoTR 13s linear infinite;
      filter: drop-shadow(0 0 6px rgba(255, 0, 127, 0.9));
    }

    .animate-seq-3 {
      stroke-dasharray: 25 100;
      animation: seqBRtoTL 13s linear infinite;
      filter: drop-shadow(0 0 6px rgba(112, 0, 255, 0.9));
    }

    .animate-seq-4 {
      stroke-dasharray: 25 100;
      animation: seqTRtoBL 13s linear infinite;
      filter: drop-shadow(0 0 6px rgba(255, 180, 0, 0.9));
    }

    /* Custom styling for inputs */
    .gs-input {
      background: transparent;
      border: none;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      outline: none;
      transition: border-color 0.3s ease, color 0.3s ease;
      padding-bottom: 8px;
    }

    .gs-input:focus {
      border-bottom-color: #ffffff;
    }

    .gs-input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    /* Custom Checkbox Animation */
    .custom-check {
      appearance: none;
      width: 18px;
      height: 18px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 50%;
      outline: none;
      cursor: pointer;
      position: relative;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .custom-check:checked {
      border-color: #ffffff;
      background-color: #ffffff;
    }

    .custom-check:checked::after {
      content: '✓';
      color: #000;
      font-size: 11px;
      font-weight: bold;
    }

    /* Smooth tab switch transition */
    .fade-panel {
      transition: opacity 0.35s ease-in-out, transform 0.35s ease-in-out;
    }

    /* Hide scrollbars */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>

<body class="min-h-screen bg-[#153A50] text-white flex items-center justify-center p-2 sm:p-4 md:p-8 lg:p-12 font-sans select-none overflow-x-hidden">

  <!-- Main Outer Container: Fluid on Mobile, Constrained Aspect Ratio on Desktop -->
  <div class="w-full max-w-[1240px] md:aspect-[16/10] md:min-h-[600px] bg-[#000000] rounded-[20px] sm:rounded-[28px] md:rounded-[40px] p-2 sm:p-4 md:p-7 shadow-[0_35px_70px_-15px_rgba(0,0,0,0.85)] border border-[#2b2d32] relative flex flex-col justify-between overflow-hidden my-auto">
    
    <!-- Outer Frame Gloss Header Details (Tablet Look - Desktop Only) -->
    <div class="hidden md:block absolute top-0 left-1/2 -translate-x-1/2 w-32 h-1.5 bg-[#18181a] rounded-b-lg z-50"></div>

    <!-- Inner Screen Area -->
    <div class="w-full h-full bg-[#050506] rounded-[16px] sm:rounded-[20px] md:rounded-[28px] overflow-hidden flex flex-col md:flex-row relative border border-[#1a1b1e]">

      <!-- Left Panel: Adaptive Height for Mobile -->
      <div class="w-full md:w-1/2 h-44 sm:h-56 md:h-full bg-gs-black relative flex flex-col justify-between p-4 sm:p-8 md:p-10 lg:p-12 border-b md:border-b-0 md:border-r border-[#151619] overflow-hidden emblem-container cursor-pointer shrink-0">
        
        <div class="absolute inset-0 bg-grid-pattern opacity-60 pointer-events-none"></div>

        <!-- Faint Structural Axis Lines with Sequential Flowing Light Beams -->
        <svg class="absolute inset-0 w-full h-full pointer-events-none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="beamCyan" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
              <stop offset="70%" stop-color="#00f0ff" stop-opacity="1" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
            </linearGradient>

            <linearGradient id="beamMagenta" x1="0%" y1="100%" x2="100%" y2="0%">
              <stop offset="0%" stop-color="#ff007f" stop-opacity="0" />
              <stop offset="70%" stop-color="#ff007f" stop-opacity="1" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
            </linearGradient>

            <linearGradient id="beamPurple" x1="100%" y1="100%" x2="0%" y2="0%">
              <stop offset="0%" stop-color="#7000ff" stop-opacity="0" />
              <stop offset="70%" stop-color="#7000ff" stop-opacity="1" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
            </linearGradient>

            <linearGradient id="beamAmber" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#ffb400" stop-opacity="0" />
              <stop offset="70%" stop-color="#ffb400" stop-opacity="1" />
              <stop offset="100%" stop-color="#ffffff" stop-opacity="1" />
            </linearGradient>
          </defs>

          <!-- Static Base Visual Lines -->
          <line x1="0" y1="0" x2="100%" y2="100%" stroke="white" stroke-width="0.75" stroke-opacity="0.1" />
          <line x1="0" y1="100%" x2="100%" y2="0%" stroke="white" stroke-width="0.75" stroke-opacity="0.1" />

          <!-- Sequential Light Beams -->
          <line x1="0" y1="0" x2="100%" y2="100%" stroke="url(#beamCyan)" stroke-width="1.8" pathLength="100" class="animate-seq-1" />
          <line x1="0" y1="100%" x2="100%" y2="0%" stroke="url(#beamMagenta)" stroke-width="1.8" pathLength="100" class="animate-seq-2" />
          <line x1="100%" y1="100%" x2="0%" y2="0%" stroke="url(#beamPurple)" stroke-width="1.8" pathLength="100" class="animate-seq-3" />
          <line x1="100%" y1="0%" x2="0%" y2="100%" stroke="url(#beamAmber)" stroke-width="1.8" pathLength="100" class="animate-seq-4" />
        </svg>

        <div class="z-10 flex items-center justify-between">
          <div class="flex items-center space-x-1 tracking-wider text-xs sm:text-sm md:text-base font-medium text-white">
            <span>FAMS</span>
            <span class="text-[9px] sm:text-[10px] align-top font-light tracking-normal opacity-80">®</span>
          </div>
        </div>

        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div class="relative w-32 h-32 sm:w-48 sm:h-48 md:w-64 md:h-64 flex items-center justify-center animate-spin-emblem">
            <div class="absolute w-20 sm:w-28 md:w-40 h-[2px] sm:h-[3px] bg-white rounded-full"></div>
            <div class="absolute h-20 sm:h-28 md:h-40 w-[2px] sm:w-[3px] bg-white rounded-full"></div>
            <div class="absolute w-16 sm:w-24 md:w-36 h-[1px] sm:h-[1.5px] bg-white opacity-90 rounded-full rotate-45"></div>
            <div class="absolute w-16 sm:w-24 md:w-36 h-[1px] sm:h-[1.5px] bg-white opacity-90 rounded-full -rotate-45"></div>
            <div class="absolute w-4 h-4 sm:w-6 sm:h-6 bg-gs-black rounded-full z-10 flex items-center justify-center"></div>
          </div>
        </div>

        <div class="z-10 text-[9px] sm:text-xs text-[#525660] font-normal tracking-wide">
          © FAMS 2026. All rights reserved.
        </div>
      </div>

      <!-- Right Form Panel: Responsive Scrollable Content Area -->
      <div class="w-full md:w-1/2 h-auto md:h-full bg-[#111215] relative flex flex-col justify-between p-5 sm:p-8 md:p-12 lg:p-16 overflow-y-auto no-scrollbar">
        
        <div id="loginView" class="fade-panel h-full flex flex-col justify-between">
          
          <div class="flex justify-end items-center mb-4 md:mb-0">
            <button id="switchToRegister" class="text-xs sm:text-sm text-gs-subtle hover:text-white transition-colors cursor-pointer font-light">
              Create an account
            </button>
          </div>

          <div class="my-auto py-4 sm:py-8">
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-extralight text-white tracking-tight mb-6 sm:mb-10 md:mb-14">
              Login
            </h1>

            <form id="loginForm" onsubmit="handleAuthSubmit(event, 'login')">
              <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 sm:gap-6 mb-6 sm:mb-8">
                
                <div class="flex flex-col space-y-2">
                  <label for="email" class="text-[10px] uppercase tracking-widest text-[#636875] font-semibold">Email</label>
                  <input type="email" id="email" required value="Mattew@gmail.com" class="gs-input text-xs sm:text-sm md:text-base font-light tracking-wide w-full" placeholder="name@domain.com">
                </div>

                <div class="flex flex-col space-y-2 relative">
                  <label for="password" class="text-[10px] uppercase tracking-widest text-[#636875] font-semibold">Password</label>
                  <div class="relative w-full">
                    <input type="password" id="password" required value="password123" class="gs-input text-xs sm:text-sm md:text-base font-light tracking-widest w-full pr-8">
                    <button type="button" onclick="togglePassword('password', 'eyeIcon1')" class="absolute right-0 bottom-2 text-[#636875] hover:text-white transition-colors">
                      <i id="eyeIcon1" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

              </div>

              <div class="flex items-center justify-between text-xs sm:text-sm font-light pt-2">
                <label class="flex items-center space-x-2.5 cursor-pointer text-[#8b909e] hover:text-white transition-colors">
                  <input type="checkbox" checked class="custom-check">
                  <span class="text-xs">Remember me</span>
                </label>
                <a href="#" onclick="showModal('Password Reset', 'Password recovery instructions have been sent to your registered email.', 'mail')" class="text-xs text-[#8b909e] hover:text-white transition-colors">
                  Forgot?
                </a>
              </div>
            </form>
          </div>

          <!-- White Button with 3-Color Animated Border -->
          <div class="flex justify-end pt-4">
            <button 
              type="submit" 
              form="loginForm"
              class="group relative rounded-full p-[2px] overflow-hidden flex items-center justify-center transition-all duration-300 hover:scale-105 active:scale-95 shadow-[0_10px_25px_rgba(255,255,255,0.15)] cursor-pointer w-full sm:w-auto"
            >
              <div class="absolute w-[400%] h-[400%] animate-[spin_3s_linear_infinite] bg-[conic-gradient(from_0deg_at_50%_50%,#00f0ff_0%,#7000ff_33%,#ff007f_66%,#00f0ff_100%)]"></div>
              
              <div class="relative z-10 flex items-center justify-center space-x-2.5 bg-white text-black px-6 sm:px-8 py-3 sm:py-3.5 rounded-full w-full h-full transition-colors duration-300 group-hover:bg-[#f3f3f3]">
                <span class="font-bold text-xs tracking-wider uppercase transition-all duration-300 group-hover:tracking-widest">SIGN IN</span>
                <i data-lucide="arrow-right" class="w-4 h-4 text-black transition-transform duration-300 group-hover:translate-x-1"></i>
              </div>
            </button>
          </div>

        </div>

        <div id="registerView" class="fade-panel h-full flex flex-col justify-between hidden opacity-0 transform translate-y-4">
          
          <div class="flex justify-end items-center mb-4 md:mb-0">
            <button id="switchToLogin" class="text-xs sm:text-sm text-gs-subtle hover:text-white transition-colors cursor-pointer font-light">
              Already registered? Sign in
            </button>
          </div>

          <div class="my-auto py-4 sm:py-8">
            <h1 class="text-3xl sm:text-5xl md:text-6xl font-extralight text-white tracking-tight mb-6 sm:mb-8">
              Create account
            </h1>

            <form id="registerForm" onsubmit="handleAuthSubmit(event, 'register')">
              <div class="space-y-4 sm:space-y-6 mb-6 sm:mb-8">
                
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                  <div class="flex flex-col space-y-2">
                    <label class="text-[10px] uppercase tracking-widest text-[#636875] font-semibold">Full Name</label>
                    <input type="text" required class="gs-input text-xs sm:text-sm md:text-base font-light tracking-wide w-full" placeholder="Mark Johnson">
                  </div>
                  <div class="flex flex-col space-y-2">
                    <label class="text-[10px] uppercase tracking-widest text-[#636875] font-semibold">Phone Number</label>
                    <input type="tel" required class="gs-input text-xs sm:text-sm md:text-base font-light tracking-wide w-full" placeholder="+41 44 123 4567">
                  </div>
                </div>

                <div class="flex flex-col space-y-2">
                  <label class="text-[10px] uppercase tracking-widest text-[#636875] font-semibold">Email Address</label>
                  <input type="email" required class="gs-input text-xs sm:text-sm md:text-base font-light tracking-wide w-full" placeholder="mattew@gmail.com">
                </div>

                <div class="flex flex-col space-y-2 relative">
                  <label class="text-[10px] uppercase tracking-widest text-[#636875] font-semibold">Password</label>
                  <div class="relative w-full">
                    <input type="password" id="regPassword" required class="gs-input text-xs sm:text-sm md:text-base font-light tracking-widest w-full pr-8" placeholder="••••••••••••">
                    <button type="button" onclick="togglePassword('regPassword', 'eyeIcon2')" class="absolute right-0 bottom-2 text-[#636875] hover:text-white transition-colors">
                      <i id="eyeIcon2" data-lucide="eye" class="w-4 h-4"></i>
                    </button>
                  </div>
                </div>

              </div>

              <div class="flex items-center space-x-2.5 pt-1">
                <input type="checkbox" required class="custom-check">
                <span class="text-xs text-[#8b909e] font-light">I accept the <a href="#" onclick="showModal('Terms of Service', 'Financial asset management services terms of luxury banking and digital vault management apply.', 'shield-check')" class="underline hover:text-white">Terms & Privacy Policy</a></span>
              </div>
            </form>
          </div>

          <div class="flex justify-end pt-4">
            <button 
              type="submit" 
              form="registerForm"
              class="group relative rounded-full p-[2px] overflow-hidden flex items-center justify-center transition-all duration-300 hover:scale-105 active:scale-95 shadow-[0_10px_25px_rgba(255,255,255,0.15)] cursor-pointer w-full sm:w-auto"
            >
              <div class="absolute w-[400%] h-[400%] animate-[spin_3s_linear_infinite] bg-[conic-gradient(from_0deg_at_50%_50%,#00f0ff_0%,#7000ff_33%,#ff007f_66%,#00f0ff_100%)]"></div>
              
              <div class="relative z-10 flex items-center justify-center space-x-2.5 bg-white text-black px-6 sm:px-8 py-3 sm:py-3.5 rounded-full w-full h-full transition-colors duration-300 group-hover:bg-[#f3f3f3]">
                <span class="font-bold text-xs tracking-wider uppercase transition-all duration-300 group-hover:tracking-widest">JOIN NOW</span>
                <i data-lucide="arrow-right" class="w-4 h-4 text-black transition-transform duration-300 group-hover:translate-x-1"></i>
              </div>
            </button>
          </div>

        </div>

      </div>

    </div>
  </div>

  <!-- Animated Pop-Up Modal: Fluid Responsive Dimensions -->
  <div id="customModal" class="fixed inset-0 bg-black/80 backdrop-blur-md z-50 flex items-center justify-center opacity-0 pointer-events-none transition-all duration-300 p-4">
    <div id="modalBox" class="bg-[#121316] border border-[#2b2d35] rounded-3xl max-w-[90vw] sm:max-w-sm w-full p-6 sm:p-8 transform scale-90 transition-all duration-300 shadow-[0_25px_50px_-12px_rgba(0,0,0,0.8)] text-center relative overflow-hidden">
      
      <div class="absolute -top-12 -left-12 w-32 h-32 bg-white/5 rounded-full blur-2xl pointer-events-none"></div>

      <div class="w-12 h-12 sm:w-16 sm:h-16 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-4 sm:mb-5 border border-white/20 text-white shadow-inner">
        <i id="modalIcon" data-lucide="check-circle-2" class="w-6 h-6 sm:w-8 sm:h-8 stroke-[1.5]"></i>
      </div>

      <h3 id="modalTitle" class="text-xl sm:text-2xl font-light text-white tracking-tight mb-2">Welcome Back</h3>
      <p id="modalBody" class="text-xs text-[#8b909e] font-light leading-relaxed mb-6">
        Authenticated successfully.
      </p>

      <button onclick="closeModal()" class="w-full py-3 sm:py-3.5 bg-white text-black font-semibold text-xs tracking-widest uppercase rounded-full hover:bg-gray-200 transition-all active:scale-95 shadow-lg cursor-pointer">
        Continue to Vault
      </button>
    </div>
  </div>

  <script>
    lucide.createIcons();

    function togglePassword(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    const loginView = document.getElementById('loginView');
    const registerView = document.getElementById('registerView');
    const switchToRegisterBtn = document.getElementById('switchToRegister');
    const switchToLoginBtn = document.getElementById('switchToLogin');

    switchToRegisterBtn.addEventListener('click', () => {
      loginView.classList.add('opacity-0', 'translate-y-4');
      setTimeout(() => {
        loginView.classList.add('hidden');
        registerView.classList.remove('hidden');
        setTimeout(() => {
          registerView.classList.remove('opacity-0', 'translate-y-4');
        }, 50);
      }, 300);
    });

    switchToLoginBtn.addEventListener('click', () => {
      registerView.classList.add('opacity-0', 'translate-y-4');
      setTimeout(() => {
        registerView.classList.add('hidden');
        loginView.classList.remove('hidden');
        setTimeout(() => {
          loginView.classList.remove('opacity-0', 'translate-y-4');
        }, 50);
      }, 300);
    });

    function showModal(title, message, iconName = 'check-circle-2') {
      const modal = document.getElementById('customModal');
      const modalBox = document.getElementById('modalBox');
      const modalIcon = document.getElementById('modalIcon');
      
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalBody').innerText = message;
      
      modalIcon.setAttribute('data-lucide', iconName);
      lucide.createIcons();

      modal.classList.remove('opacity-0', 'pointer-events-none');
      modalBox.classList.remove('scale-90');
      modalBox.classList.add('scale-100');
    }

    function closeModal() {
      const modal = document.getElementById('customModal');
      const modalBox = document.getElementById('modalBox');
      
      modal.classList.add('opacity-0', 'pointer-events-none');
      modalBox.classList.remove('scale-100');
      modalBox.classList.add('scale-90');
    }

    function handleAuthSubmit(event, mode) {
      event.preventDefault();
      if (mode === 'login') {
        const email = document.getElementById('email').value;
        showModal(
          'Authentication Successful', 
          `Welcome back, ${email}. Your secure FAMS vault session is ready.`, 
          'check-circle-2'
        );
      } else {
        showModal(
          'Account Created', 
          'Your registration request has been submitted. A relationship manager will contact you shortly.', 
          'user-check'
        );
      }
    }
  </script>
</body>
</html>
